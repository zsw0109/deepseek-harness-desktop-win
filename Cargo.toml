[package]
name = "dsh-desktop"
version = "1.0.0"
edition = "2021"
description = "DeepSeek Harness desktop client - embedded WebView2 browser for http://127.0.0.1:3080"
authors = ["DeepSeek Harness"]
license = "MIT"

[build-dependencies]
embed-resource = "=3.0.9"

[dependencies]
wry = "=0.55.1"
tao = "=0.35.2"
ico = "=0.5.0"
winreg = { version = "=0.55.0", default-features = false }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
